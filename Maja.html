<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MAJA</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;0,9..144,700;1,9..144,500&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --paper: #E7E5DC;
    --paper-raised: #F3F1E9;
    --ink: #1C2130;
    --ink-soft: #565A68;
    --line: #CFCBBD;
    --indigo: #4C4FE0;
    --indigo-soft: #E7E7FB;
    --c1: #E15A4D;
    --c2: #1F9C8B;
    --c3: #D9A441;
    --c4: #5B5FEF;
    --c5: #B6588C;
    --c6: #3D8FCC;
    --radius: 14px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;height:100%;}
  body{
    background: var(--paper);
    color: var(--ink);
    font-family: 'Inter', sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  ::selection{ background: var(--indigo-soft); }

  .app{
    max-width: 1100px;
    margin: 0 auto;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }

  header.top{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding: 22px 20px 16px;
    border-bottom: 1px solid var(--line);
  }
  .logo{
    font-family:'Fraunces', serif;
    font-weight:700;
    font-size: 26px;
    letter-spacing: -0.02em;
    display:flex;
    align-items:baseline;
    gap:8px;
  }
  .logo .tag{
    font-family:'IBM Plex Mono', monospace;
    font-size:11px;
    color: var(--ink-soft);
    font-weight:400;
    letter-spacing: 0.02em;
  }
  .whoami{
    font-family:'IBM Plex Mono', monospace;
    font-size:12px;
    color: var(--ink-soft);
    display:flex;
    align-items:center;
    gap:8px;
  }
  .whoami button{
    background:none;border:none;color:var(--indigo);cursor:pointer;
    font-family:'IBM Plex Mono', monospace;font-size:12px;text-decoration:underline;
    padding:0;
  }

  .layout{
    flex:1;
    display:flex;
    min-height:0;
  }
  .feed-col{
    width: 360px;
    flex-shrink:0;
    border-right: 1px solid var(--line);
    display:flex;
    flex-direction:column;
    min-height:0;
  }
  .detail-col{
    flex:1;
    min-width:0;
    display:flex;
    flex-direction:column;
    min-height:0;
  }

  .compose-box{
    padding: 16px;
    border-bottom: 1px solid var(--line);
  }
  .compose-trigger{
    width:100%;
    text-align:left;
    background: var(--paper-raised);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    padding: 12px 14px;
    font-family:'Inter';
    font-size:14px;
    color: var(--ink-soft);
    cursor:pointer;
  }
  .compose-trigger:hover{ border-color: var(--indigo); color: var(--ink); }

  .compose-form{
    background: var(--paper-raised);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    padding: 14px;
    display:flex;
    flex-direction:column;
    gap:10px;
  }
  input, textarea{
    font-family:'Inter';
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 10px 12px;
    font-size: 14px;
    background: #fff;
    color: var(--ink);
    resize: vertical;
  }
  input:focus, textarea:focus{ outline: 2px solid var(--indigo); outline-offset: 1px; border-color: var(--indigo); }
  input.title-input{ font-family:'Fraunces'; font-weight:600; font-size:16px; }

  .form-row{ display:flex; gap:8px; justify-content:flex-end; }
  .btn{
    font-family:'Inter'; font-weight:600; font-size:13px;
    border-radius: 999px;
    padding: 8px 16px;
    border: 1px solid var(--line);
    background: #fff;
    cursor:pointer;
    color: var(--ink);
  }
  .btn.primary{
    background: var(--indigo);
    border-color: var(--indigo);
    color: white;
  }
  .btn.primary:disabled{ opacity:0.5; cursor:default; }
  .btn:hover:not(:disabled){ filter: brightness(0.97); }
  .btn.small{ padding: 5px 12px; font-size:12px; }

  .feed-list{
    flex:1;
    overflow-y:auto;
    padding: 6px 0;
  }
  .thread-card{
    display:flex;
    gap:12px;
    padding: 14px 16px;
    cursor:pointer;
    border-bottom: 1px solid var(--line);
    position:relative;
  }
  .thread-card:hover{ background: var(--paper-raised); }
  .thread-card.active{ background: var(--indigo-soft); }
  .swatch{
    width:4px;
    border-radius: 4px;
    flex-shrink:0;
  }
  .card-body{ min-width:0; flex:1; }
  .card-title{
    font-family:'Fraunces'; font-weight:600; font-size:15px;
    margin: 0 0 4px;
    color: var(--ink);
  }
  .card-snippet{
    font-size:13px; color: var(--ink-soft);
    margin: 0 0 6px;
    white-space: nowrap; overflow:hidden; text-overflow:ellipsis;
  }
  .card-meta{
    font-family:'IBM Plex Mono', monospace;
    font-size:11px;
    color: var(--ink-soft);
    display:flex; gap:10px;
  }

  .empty-state{
    padding: 40px 24px;
    text-align:center;
    color: var(--ink-soft);
    font-size:14px;
  }
  .empty-state .big{ font-family:'Fraunces'; font-size: 18px; color: var(--ink); margin-bottom:6px; }

  .detail-scroll{
    flex:1;
    overflow-y:auto;
    padding: 20px 28px 60px;
  }
  .detail-empty{
    flex:1;
    display:flex; align-items:center; justify-content:center;
    color: var(--ink-soft);
    font-family:'Fraunces';
    font-size: 18px;
    text-align:center;
    padding: 40px;
  }
  .back-btn{
    display:none;
    font-family:'IBM Plex Mono', monospace;
    font-size:12px;
    background:none; border:none; color:var(--indigo);
    cursor:pointer;
    padding: 14px 16px 0;
    align-self:flex-start;
  }

  .thread-title{
    font-family:'Fraunces'; font-weight:700; font-size: 24px;
    margin: 4px 0 18px;
  }

  .msg{
    position: relative;
    padding-left: 30px;
    margin-bottom: 4px;
  }
  .msg.root{ padding-left: 0; margin-bottom: 22px; }
  .msg::before{
    content:'';
    position:absolute;
    left: 9px; top: 30px; bottom: -4px;
    width: 2px;
    background: var(--thread-color, var(--indigo));
    opacity: 0.3;
  }
  .msg.last-child::before{ display:none; }
  .msg .dot{
    position:absolute;
    left: 4px; top: 6px;
    width: 12px; height: 12px;
    border-radius: 50%;
    background: var(--thread-color, var(--indigo));
    border: 2px solid var(--paper);
  }
  .msg-card{
    background: var(--paper-raised);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    padding: 12px 14px;
    margin-bottom: 8px;
  }
  .msg.root .msg-card{
    background: #fff;
    border-color: var(--thread-color, var(--line));
  }
  .msg-head{
    display:flex; align-items:center; gap:8px;
    margin-bottom:4px;
  }
  .avatar{
    width:22px; height:22px; border-radius:50%;
    background: var(--ink);
    color:#fff;
    font-size:11px; font-weight:600;
    display:flex; align-items:center; justify-content:center;
    font-family:'Inter';
    flex-shrink:0;
  }
  .author{ font-weight:600; font-size:13px; }
  .time{ font-family:'IBM Plex Mono', monospace; font-size:11px; color: var(--ink-soft); }
  .msg-text{ font-size:14px; line-height:1.5; white-space: pre-wrap; word-break: break-word; }
  .msg-actions{
    display:flex; gap:14px; margin-top:6px;
    padding-left: 2px;
  }
  .action-btn{
    background:none; border:none; cursor:pointer;
    font-family:'IBM Plex Mono', monospace;
    font-size:11px; color: var(--ink-soft);
    padding:0; display:flex; align-items:center; gap:4px;
  }
  .action-btn:hover{ color: var(--indigo); }
  .action-btn.liked{ color: var(--c1); }

  .reply-form{
    margin: 8px 0 12px;
    display:flex; flex-direction:column; gap:6px;
  }
  .reply-form textarea{ min-height: 54px; }

  .children{ margin-top: 2px; }

  .loading{ padding: 30px; text-align:center; color: var(--ink-soft); font-family:'IBM Plex Mono', monospace; font-size:12px; }
  .error-banner{
    margin: 10px 16px; padding: 10px 12px;
    background: #FBE7E4; border: 1px solid #E15A4D;
    border-radius: 10px; font-size: 13px; color: #7A2A22;
  }

  @media (max-width: 760px){
    .layout{ position:relative; overflow:hidden; }
    .feed-col{ width:100%; border-right:none; }
    .detail-col{
      position:absolute; inset:0;
      background: var(--paper);
      transform: translateX(100%);
      transition: transform 0.22s ease;
    }
    .detail-col.open{ transform: translateX(0); }
    .back-btn{ display:block; }
    .detail-scroll{ padding: 12px 16px 60px; }
  }

  .view{ flex:1; min-height:0; display:none; flex-direction:column; }
  .view.active{ display:flex; }

  .bottom-nav{
    flex-shrink:0;
    display:flex;
    border-top: 1px solid var(--line);
    background: var(--paper-raised);
  }
  .nav-btn{
    flex:1;
    display:flex; flex-direction:column; align-items:center; gap:3px;
    padding: 9px 4px 10px;
    background:none; border:none; cursor:pointer;
    font-family:'Inter'; font-size:11px; font-weight:600;
    color: var(--ink-soft);
  }
  .nav-btn .nav-icon{ font-size:18px; line-height:1; }
  .nav-btn.active{ color: var(--indigo); }
  .nav-btn:hover{ color: var(--ink); }
  .nav-btn.active:hover{ color: var(--indigo); }

  .chat-view{ flex:1; min-height:0; display:flex; flex-direction:column; }
  .chat-scroll{
    flex:1; overflow-y:auto; padding: 16px 20px;
    display:flex; flex-direction:column; gap:10px;
  }
  .chat-row{ display:flex; gap:8px; align-items:flex-start; max-width: 480px; }
  .chat-row.mine{ align-self:flex-end; flex-direction:row-reverse; }
  .chat-bubble{
    background: var(--paper-raised);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    padding: 8px 12px;
  }
  .chat-row.mine .chat-bubble{ background: var(--indigo-soft); border-color: var(--indigo); }
  .chat-meta-line{ display:flex; gap:8px; align-items:baseline; margin-bottom:2px; }
  .chat-row.mine .chat-meta-line{ flex-direction:row-reverse; }
  .chat-input-row{
    display:flex; gap:8px; padding: 12px 16px;
    border-top: 1px solid var(--line);
  }
  .chat-input-row textarea{ flex:1; min-height:40px; max-height:120px; }

  .profile-view{
    flex:1; padding: 30px 24px; overflow-y:auto;
  }
  .profile-card{
    max-width: 420px;
    background: var(--paper-raised);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    padding: 24px;
    text-align:center;
  }
  .profile-avatar{
    width:64px; height:64px; border-radius:50%;
    background: var(--indigo); color:#fff;
    font-family:'Fraunces'; font-weight:700; font-size:24px;
    display:flex; align-items:center; justify-content:center;
    margin: 0 auto 14px;
  }
  .profile-name{ font-family:'Fraunces'; font-weight:700; font-size:20px; margin: 0 0 4px; }
  .profile-sub{ font-size:13px; color: var(--ink-soft); margin: 0 0 18px; }
  .profile-stats{
    display:flex; justify-content:center; gap:28px;
    margin-bottom: 20px;
    font-family:'IBM Plex Mono', monospace;
  }
  .profile-stats .stat-num{ font-size:18px; font-weight:600; color: var(--ink); display:block; }
  .profile-stats .stat-label{ font-size:10px; color: var(--ink-soft); }
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <div class="logo">MAJA <span class="tag">threads that branch</span></div>
    <div class="whoami" id="whoami"></div>
  </header>

  <div class="view active" id="viewThreads">
    <div class="layout">
      <div class="feed-col">
        <div class="compose-box" id="composeBox"></div>
        <div class="feed-list" id="feedList">
          <div class="loading">loading threads…</div>
        </div>
      </div>
      <div class="detail-col" id="detailCol">
        <button class="back-btn" id="backBtn">← back</button>
        <div class="detail-empty" id="detailEmpty">Pick a thread, or start one — every reply keeps its own colored line back to the root.</div>
        <div class="detail-scroll" id="detailScroll" style="display:none;"></div>
      </div>
    </div>
  </div>

  <div class="view" id="viewChat">
    <div class="chat-view">
      <div class="chat-scroll" id="chatScroll"><div class="loading">loading chat…</div></div>
      <div class="chat-input-row">
        <textarea id="chatInput" placeholder="Message everyone…" maxlength="1000"></textarea>
        <button class="btn primary" id="chatSendBtn">Send</button>
      </div>
    </div>
  </div>

  <div class="view" id="viewProfile">
    <div class="profile-view">
      <div class="profile-card">
        <div class="profile-avatar" id="profileAvatar">?</div>
        <p class="profile-name" id="profileName">Not set</p>
        <p class="profile-sub">This name shows on everything you post.</p>
        <div class="profile-stats">
          <div><span class="stat-num" id="statThreads">0</span><span class="stat-label">THREADS</span></div>
          <div><span class="stat-num" id="statReplies">0</span><span class="stat-label">REPLIES</span></div>
        </div>
        <button class="btn primary" id="profileEditBtn">Change name</button>
      </div>
    </div>
  </div>

  <nav class="bottom-nav">
    <button class="nav-btn active" data-view="viewThreads"><span class="nav-icon">&#9673;</span>Threads</button>
    <button class="nav-btn" data-view="viewChat"><span class="nav-icon">&#128172;</span>Chat</button>
    <button class="nav-btn" data-view="viewProfile"><span class="nav-icon">&#9679;</span>Profile</button>
  </nav>
</div>

<script>
  const firebaseConfig = {
    apiKey: "PASTE_YOUR_API_KEY",
    authDomain: "PASTE_YOUR_PROJECT.firebaseapp.com",
    projectId: "PASTE_YOUR_PROJECT_ID",
    storageBucket: "PASTE_YOUR_PROJECT.appspot.com",
    messagingSenderId: "PASTE_YOUR_SENDER_ID",
    appId: "PASTE_YOUR_APP_ID"
  };
  firebase.initializeApp(firebaseConfig);
  const db = firebase.firestore();

  // Drop-in replacement for the Claude-artifact window.storage API,
  // backed by Firestore (shared=true) and localStorage (shared=false).
  // The rest of the app below is completely unchanged.
  window.storage = {
    async get(key, shared){
      if(shared){
        const doc = await db.collection('maja_kv').doc(key).get();
        if(!doc.exists) throw new Error('not found: ' + key);
        return { key, value: doc.data().value, shared };
      } else {
        const v = localStorage.getItem('maja_' + key);
        if(v === null) throw new Error('not found: ' + key);
        return { key, value: v, shared };
      }
    },
    async set(key, value, shared){
      if(shared){
        await db.collection('maja_kv').doc(key).set({ value });
      } else {
        localStorage.setItem('maja_' + key, value);
      }
      return { key, value, shared };
    },
    async delete(key, shared){
      if(shared){
        await db.collection('maja_kv').doc(key).delete();
      } else {
        localStorage.removeItem('maja_' + key);
      }
      return { key, deleted: true, shared };
    },
    async list(prefix, shared){
      if(shared){
        let ref = db.collection('maja_kv');
        const snap = await ref.get();
        const keys = snap.docs.map(d => d.id).filter(k => !prefix || k.startsWith(prefix));
        return { keys, prefix, shared };
      } else {
        const keys = Object.keys(localStorage)
          .filter(k => k.startsWith('maja_'))
          .map(k => k.slice(5))
          .filter(k => !prefix || k.startsWith(prefix));
        return { keys, prefix, shared };
      }
    }
  };
</script>

<script>
(function(){
  const COLORS = ['#E15A4D','#1F9C8B','#D9A441','#5B5FEF','#B6588C','#3D8FCC'];
  let myName = null;
  let threadsIndex = [];
  let activeThreadId = null;
  let activeThreadData = null;
  let composeOpen = false;
  let currentView = 'viewThreads';
  let chatMessages = [];
  let chatPollTimer = null;

  const chatScroll = document.getElementById('chatScroll');
  const chatInput = document.getElementById('chatInput');
  const chatSendBtn = document.getElementById('chatSendBtn');
  const profileAvatar = document.getElementById('profileAvatar');
  const profileName = document.getElementById('profileName');
  const statThreads = document.getElementById('statThreads');
  const statReplies = document.getElementById('statReplies');
  const profileEditBtn = document.getElementById('profileEditBtn');

  const feedList = document.getElementById('feedList');
  const composeBox = document.getElementById('composeBox');
  const whoami = document.getElementById('whoami');
  const detailCol = document.getElementById('detailCol');
  const detailEmpty = document.getElementById('detailEmpty');
  const detailScroll = document.getElementById('detailScroll');
  const backBtn = document.getElementById('backBtn');

  function escapeHtml(s){
    return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }
  function initials(name){
    if(!name) return '?';
    const parts = name.trim().split(/\s+/);
    return (parts[0][0] + (parts[1] ? parts[1][0] : '')).toUpperCase();
  }
  function timeAgo(ts){
    const diff = Math.max(0, Date.now() - ts);
    const m = Math.floor(diff/60000);
    if(m < 1) return 'just now';
    if(m < 60) return m + 'm';
    const h = Math.floor(m/60);
    if(h < 24) return h + 'h';
    const d = Math.floor(h/24);
    return d + 'd';
  }
  function countReplies(messages, rootId){
    let count = 0;
    function walk(id){
      const node = messages[id];
      if(!node) return;
      for(const cid of (node.children||[])){
        count++;
        walk(cid);
      }
    }
    walk(rootId);
    return count;
  }

  async function loadName(){
    try{
      const res = await window.storage.get('my-name', false);
      myName = res ? res.value : null;
    }catch(e){ myName = null; }
    renderWhoAmI();
  }

  function renderWhoAmI(){
    if(myName){
      whoami.innerHTML = `posting as <strong style="color:var(--ink)">${escapeHtml(myName)}</strong> · <button id="changeNameBtn">change</button>`;
      document.getElementById('changeNameBtn').onclick = promptForName;
    } else {
      whoami.innerHTML = `<button id="setNameBtn">set your name</button>`;
      document.getElementById('setNameBtn').onclick = promptForName;
    }
    renderProfileView();
  }

  async function promptForName(){
    const name = window.prompt('What name should show on your posts?', myName || '');
    if(name && name.trim()){
      myName = name.trim().slice(0, 40);
      try{
        await window.storage.set('my-name', myName, false);
      }catch(e){ /* best effort */ }
      renderWhoAmI();
    }
  }

  async function loadFeed(){
    feedList.innerHTML = '<div class="loading">loading threads…</div>';
    try{
      let res;
      try{
        res = await window.storage.get('threads-index', true);
      }catch(e){
        res = null;
      }
      threadsIndex = res && res.value ? JSON.parse(res.value) : [];
    }catch(e){
      feedList.innerHTML = '<div class="error-banner">Couldn\'t load threads. Pull to refresh or try again.</div>';
      return;
    }
    renderFeed();
  }

  function renderFeed(){
    if(threadsIndex.length === 0){
      feedList.innerHTML = `<div class="empty-state"><div class="big">No threads yet</div>Start the first one below.</div>`;
      return;
    }
    const sorted = [...threadsIndex].sort((a,b) => b.updatedAt - a.updatedAt);
    feedList.innerHTML = sorted.map(t => `
      <div class="thread-card ${t.id === activeThreadId ? 'active' : ''}" data-id="${t.id}">
        <div class="swatch" style="background:${t.color}"></div>
        <div class="card-body">
          <p class="card-title">${escapeHtml(t.title)}</p>
          <p class="card-snippet">${escapeHtml(t.snippet)}</p>
          <div class="card-meta">
            <span>${escapeHtml(t.authorName)}</span>
            <span>${timeAgo(t.updatedAt)}</span>
            <span>${t.replyCount} ${t.replyCount === 1 ? 'reply' : 'replies'}</span>
          </div>
        </div>
      </div>
    `).join('');
    feedList.querySelectorAll('.thread-card').forEach(el => {
      el.addEventListener('click', () => openThread(el.dataset.id));
    });
  }

  function renderComposeClosed(){
    composeOpen = false;
    composeBox.innerHTML = `<button class="compose-trigger" id="composeTrigger">Start a thread…</button>`;
    document.getElementById('composeTrigger').onclick = () => { renderComposeOpen(); };
  }

  function renderComposeOpen(){
    composeOpen = true;
    composeBox.innerHTML = `
      <div class="compose-form">
        <input class="title-input" id="newTitle" placeholder="Give it a title" maxlength="120" />
        <textarea id="newBody" rows="3" placeholder="What's the first message?" maxlength="2000"></textarea>
        <div class="form-row">
          <button class="btn" id="cancelCompose">Cancel</button>
          <button class="btn primary" id="submitCompose">Post thread</button>
        </div>
      </div>
    `;
    document.getElementById('cancelCompose').onclick = renderComposeClosed;
    document.getElementById('submitCompose').onclick = submitNewThread;
    document.getElementById('newTitle').focus();
  }

  async function submitNewThread(){
    const title = document.getElementById('newTitle').value.trim();
    const body = document.getElementById('newBody').value.trim();
    if(!title || !body) return;
    if(!myName){
      await promptForName();
      if(!myName) return;
    }
    const submitBtn = document.getElementById('submitCompose');
    submitBtn.disabled = true;
    submitBtn.textContent = 'Posting…';

    const now = Date.now();
    const threadId = 'th_' + now + '_' + Math.random().toString(36).slice(2,7);
    const rootId = 'm_' + now;
    const color = COLORS[threadsIndex.length % COLORS.length];

    const threadData = {
      id: threadId,
      title, color,
      authorName: myName,
      createdAt: now,
      rootId,
      messages: {
        [rootId]: {
          id: rootId, parentId: null, authorName: myName,
          text: body, createdAt: now, likes: 0, children: []
        }
      }
    };

    try{
      const saved = await window.storage.set('thread-' + threadId, JSON.stringify(threadData), true);
      if(!saved) throw new Error('save failed');
      const summary = {
        id: threadId, title, color,
        authorName: myName,
        snippet: body.slice(0, 90),
        createdAt: now, updatedAt: now,
        replyCount: 0
      };
      threadsIndex.push(summary);
      await window.storage.set('threads-index', JSON.stringify(threadsIndex), true);
      renderComposeClosed();
      renderFeed();
      openThread(threadId);
    }catch(e){
      submitBtn.disabled = false;
      submitBtn.textContent = 'Post thread';
      alert("Couldn't post that thread — check your connection and try again.");
    }
  }

  async function openThread(id){
    activeThreadId = id;
    renderFeed();
    detailEmpty.style.display = 'none';
    detailScroll.style.display = 'block';
    detailScroll.innerHTML = '<div class="loading">loading thread…</div>';
    detailCol.classList.add('open');

    try{
      const res = await window.storage.get('thread-' + id, true);
      activeThreadData = res && res.value ? JSON.parse(res.value) : null;
    }catch(e){
      activeThreadData = null;
    }
    if(!activeThreadData){
      detailScroll.innerHTML = '<div class="error-banner">This thread could not be loaded.</div>';
      return;
    }
    renderThreadDetail();
  }

  function closeThread(){
    detailCol.classList.remove('open');
  }

  function renderThreadDetail(){
    const t = activeThreadData;
    detailScroll.style.setProperty('--thread-color', t.color);
    const root = t.messages[t.rootId];
    detailScroll.innerHTML = `
      <div class="thread-title">${escapeHtml(t.title)}</div>
      <div id="msgTree"></div>
    `;
    const tree = document.getElementById('msgTree');
    tree.style.setProperty('--thread-color', t.color);
    tree.appendChild(renderMessage(root, true, true));
  }

  function renderMessage(node, isRoot, isLastSibling){
    const wrap = document.createElement('div');
    wrap.className = 'msg' + (isRoot ? ' root' : '') + (isLastSibling ? ' last-child' : '');
    if(!isRoot){
      const dot = document.createElement('div');
      dot.className = 'dot';
      wrap.appendChild(dot);
    }
    const card = document.createElement('div');
    card.className = 'msg-card';
    card.innerHTML = `
      <div class="msg-head">
        <div class="avatar">${escapeHtml(initials(node.authorName))}</div>
        <span class="author">${escapeHtml(node.authorName)}</span>
        <span class="time">${timeAgo(node.createdAt)}</span>
      </div>
      <div class="msg-text">${escapeHtml(node.text)}</div>
      <div class="msg-actions">
        <button class="action-btn like-btn">♥ ${node.likes || 0}</button>
        <button class="action-btn reply-btn">↩ reply</button>
      </div>
    `;
    wrap.appendChild(card);

    card.querySelector('.like-btn').onclick = () => likeMessage(node.id);
    card.querySelector('.reply-btn').onclick = () => toggleReplyForm(wrap, node.id);

    const childrenWrap = document.createElement('div');
    childrenWrap.className = 'children';
    const kids = node.children || [];
    kids.forEach((cid, i) => {
      const childNode = activeThreadData.messages[cid];
      if(!childNode) return;
      childrenWrap.appendChild(renderMessage(childNode, false, i === kids.length - 1));
    });
    wrap.appendChild(childrenWrap);

    return wrap;
  }

  function toggleReplyForm(msgEl, parentId){
    const existing = msgEl.querySelector(':scope > .reply-form');
    if(existing){ existing.remove(); return; }
    const form = document.createElement('div');
    form.className = 'reply-form';
    form.innerHTML = `
      <textarea placeholder="Reply…" maxlength="2000"></textarea>
      <div class="form-row">
        <button class="btn small cancel-reply">Cancel</button>
        <button class="btn primary small send-reply">Reply</button>
      </div>
    `;
    msgEl.insertBefore(form, msgEl.querySelector('.children'));
    const ta = form.querySelector('textarea');
    ta.focus();
    form.querySelector('.cancel-reply').onclick = () => form.remove();
    form.querySelector('.send-reply').onclick = () => submitReply(parentId, ta.value.trim(), form);
  }

  async function submitReply(parentId, text, formEl){
    if(!text) return;
    if(!myName){
      await promptForName();
      if(!myName) return;
    }
    const btn = formEl.querySelector('.send-reply');
    btn.disabled = true;
    btn.textContent = 'Sending…';

    const now = Date.now();
    const newId = 'm_' + now + '_' + Math.random().toString(36).slice(2,6);
    const t = activeThreadData;
    t.messages[newId] = {
      id: newId, parentId, authorName: myName,
      text, createdAt: now, likes: 0, children: []
    };
    t.messages[parentId].children.push(newId);

    try{
      await window.storage.set('thread-' + t.id, JSON.stringify(t), true);
      const idx = threadsIndex.find(x => x.id === t.id);
      if(idx){
        idx.replyCount = countReplies(t.messages, t.rootId);
        idx.updatedAt = now;
        await window.storage.set('threads-index', JSON.stringify(threadsIndex), true);
      }
      renderThreadDetail();
      renderFeed();
      bumpReplyCount();
    }catch(e){
      btn.disabled = false;
      btn.textContent = 'Reply';
      alert("Couldn't send that reply — try again.");
    }
  }

  async function bumpReplyCount(){
    try{
      let res;
      try{ res = await window.storage.get('my-reply-count', false); }catch(e){ res = null; }
      const count = (res && res.value ? parseInt(res.value, 10) : 0) + 1;
      await window.storage.set('my-reply-count', String(count), false);
      renderProfileView();
    }catch(e){ /* best effort */ }
  }

  async function likeMessage(msgId){
    const t = activeThreadData;
    const node = t.messages[msgId];
    if(!node) return;
    node.likes = (node.likes || 0) + 1;
    renderThreadDetail();
    try{
      await window.storage.set('thread-' + t.id, JSON.stringify(t), true);
    }catch(e){
      node.likes -= 1;
      renderThreadDetail();
    }
  }

  backBtn.addEventListener('click', closeThread);

  // ---- bottom nav / view switching ----
  function switchView(viewId){
    if(viewId === currentView) return;
    currentView = viewId;
    document.querySelectorAll('.view').forEach(v => v.classList.toggle('active', v.id === viewId));
    document.querySelectorAll('.nav-btn').forEach(b => b.classList.toggle('active', b.dataset.view === viewId));

    if(chatPollTimer){ clearInterval(chatPollTimer); chatPollTimer = null; }

    if(viewId === 'viewChat'){
      loadChat();
      chatPollTimer = setInterval(loadChat, 6000);
    } else if(viewId === 'viewProfile'){
      renderProfileView();
    }
  }
  document.querySelectorAll('.nav-btn').forEach(btn => {
    btn.addEventListener('click', () => switchView(btn.dataset.view));
  });

  // ---- chat tab ----
  async function loadChat(){
    try{
      let res;
      try{ res = await window.storage.get('chat-messages', true); }catch(e){ res = null; }
      chatMessages = res && res.value ? JSON.parse(res.value) : [];
    }catch(e){
      chatScroll.innerHTML = '<div class="error-banner">Couldn\'t load chat.</div>';
      return;
    }
    renderChat();
  }

  function renderChat(){
    const wasNearBottom = chatScroll.scrollTop + chatScroll.clientHeight >= chatScroll.scrollHeight - 40;
    if(chatMessages.length === 0){
      chatScroll.innerHTML = `<div class="empty-state"><div class="big">No messages yet</div>Say something below.</div>`;
      return;
    }
    chatScroll.innerHTML = chatMessages.map(m => `
      <div class="chat-row ${m.authorName === myName ? 'mine' : ''}">
        <div class="avatar">${escapeHtml(initials(m.authorName))}</div>
        <div>
          <div class="chat-meta-line">
            <span class="author">${escapeHtml(m.authorName)}</span>
            <span class="time">${timeAgo(m.createdAt)}</span>
          </div>
          <div class="chat-bubble"><div class="msg-text">${escapeHtml(m.text)}</div></div>
        </div>
      </div>
    `).join('');
    if(wasNearBottom || document.activeElement === chatInput){
      chatScroll.scrollTop = chatScroll.scrollHeight;
    }
  }

  async function sendChatMessage(){
    const text = chatInput.value.trim();
    if(!text) return;
    if(!myName){
      await promptForName();
      if(!myName) return;
    }
    chatSendBtn.disabled = true;
    const now = Date.now();
    const newMsg = { id: 'c_' + now + '_' + Math.random().toString(36).slice(2,6), authorName: myName, text, createdAt: now };
    const optimistic = [...chatMessages, newMsg];
    chatMessages = optimistic.slice(-200);
    renderChat();
    chatInput.value = '';
    try{
      let res;
      try{ res = await window.storage.get('chat-messages', true); }catch(e){ res = null; }
      const latest = res && res.value ? JSON.parse(res.value) : [];
      latest.push(newMsg);
      const trimmed = latest.slice(-200);
      await window.storage.set('chat-messages', JSON.stringify(trimmed), true);
      chatMessages = trimmed;
      renderChat();
    }catch(e){
      alert("Couldn't send that message — try again.");
    }
    chatSendBtn.disabled = false;
  }
  chatSendBtn.addEventListener('click', sendChatMessage);
  chatInput.addEventListener('keydown', (e) => {
    if(e.key === 'Enter' && !e.shiftKey){
      e.preventDefault();
      sendChatMessage();
    }
  });

  // ---- profile tab ----
  async function renderProfileView(){
    if(!myName){
      profileAvatar.textContent = '?';
      profileName.textContent = 'Not set';
      statThreads.textContent = '0';
      statReplies.textContent = '0';
      return;
    }
    profileAvatar.textContent = initials(myName);
    profileName.textContent = myName;
    statThreads.textContent = threadsIndex.filter(t => t.authorName === myName).length;
    try{
      let res;
      try{ res = await window.storage.get('my-reply-count', false); }catch(e){ res = null; }
      statReplies.textContent = res && res.value ? res.value : '0';
    }catch(e){
      statReplies.textContent = '0';
    }
  }
  profileEditBtn.addEventListener('click', promptForName);

  renderComposeClosed();
  loadName();
  loadFeed();
})();
</script>
</body>
</html>
