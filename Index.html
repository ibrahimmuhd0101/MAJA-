<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#000000">

  <title>MAJA</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background: #f6f6f6;
      color: #111;
    }

    .app {
      max-width: 600px;
      margin: auto;
      min-height: 100vh;
      background: white;
    }

    /* HEADER */

    header {
      height: 65px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 18px;
      border-bottom: 1px solid #eee;
      position: sticky;
      top: 0;
      background: white;
      z-index: 10;
    }

    .logo {
      font-size: 27px;
      font-weight: 800;
      letter-spacing: -1px;
    }

    .menu {
      font-size: 22px;
    }

    /* THREADS */

    .create-box {
      padding: 18px;
      border-bottom: 1px solid #eee;
    }

    .create-row {
      display: flex;
      gap: 12px;
      align-items: center;
    }

    .avatar {
      width: 45px;
      height: 45px;
      border-radius: 50%;
      background: #111;
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
      flex-shrink: 0;
    }

    .placeholder {
      color: #888;
      font-size: 15px;
    }

    .create-button {
      margin-top: 14px;
      width: 100%;
      height: 45px;
      border: none;
      border-radius: 12px;
      background: #111;
      color: white;
      font-weight: bold;
      font-size: 14px;
    }

    /* THREAD */

    .thread {
      padding: 18px;
      border-bottom: 1px solid #eee;
    }

    .user-row {
      display: flex;
      gap: 12px;
      align-items: center;
    }

    .username {
      font-weight: bold;
      font-size: 15px;
    }

    .time {
      color: #999;
      font-size: 12px;
      margin-top: 3px;
    }

    .thread-text {
      margin: 14px 0;
      font-size: 15px;
      line-height: 1.6;
    }

    .actions {
      display: flex;
      gap: 28px;
      color: #666;
      font-size: 14px;
    }

    .actions span {
      cursor: pointer;
    }

    .actions span:hover {
      color: black;
    }

    /* BOTTOM NAV */

    .bottom-nav {
      position: fixed;
      bottom: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 100%;
      max-width: 600px;
      height: 68px;
      background: white;
      border-top: 1px solid #eee;
      display: flex;
      justify-content: space-around;
      align-items: center;
      z-index: 20;
    }

    .nav-item {
      text-align: center;
      color: #888;
      font-size: 12px;
      cursor: pointer;
    }

    .nav-item.active {
      color: #111;
      font-weight: bold;
    }

    .nav-icon {
      font-size: 21px;
      margin-bottom: 4px;
    }

    .content {
      padding-bottom: 80px;
    }
  </style>
</head>

<body>

<div class="app">

  <header>
    <div class="logo">MAJA</div>
    <div class="menu">•••</div>
  </header>

  <main class="content">

    <!-- CREATE THREAD -->

    <div class="create-box">

      <div class="create-row">

        <div class="avatar">M</div>

        <div class="placeholder">
          What's happening?
        </div>

      </div>

      <button class="create-button">
        Create Thread
      </button>

    </div>


    <!-- THREAD 1 -->

    <article class="thread">

      <div class="user-row">

        <div class="avatar">A</div>

        <div>

          <div class="username">
            Abdullahi
          </div>

          <div class="time">
            2 minutes ago
          </div>

        </div>

      </div>

      <div class="thread-text">
        Welcome to MAJA 👋
        A simple place to connect and share your thoughts.
      </div>

      <div class="actions">

        <span>♡ Like</span>

        <span>💬 Reply</span>

        <span>↗ Share</span>

      </div>

    </article>


    <!-- THREAD 2 -->

    <article class="thread">

      <div class="user-row">

        <div class="avatar">S</div>

        <div>

          <div class="username">
            Sadiq
          </div>

          <div class="time">
            10 minutes ago
          </div>

        </div>

      </div>

      <div class="thread-text">
        MAJA is simple, clean and easy to use.
      </div>

      <div class="actions">

        <span>♡ Like</span>

        <span>💬 Reply</span>

        <span>↗ Share</span>

      </div>

    </article>

  </main>


  <!-- NAVIGATION -->

  <nav class="bottom-nav">

    <div class="nav-item active">
      <div class="nav-icon">🧵</div>
      Threads
    </div>

    <div class="nav-item">
      <div class="nav-icon">💬</div>
      Chat
    </div>

    <div class="nav-item">
      <div class="nav-icon">👤</div>
      Profile
    </div>

  </nav>

</div>

</body>
</html>
